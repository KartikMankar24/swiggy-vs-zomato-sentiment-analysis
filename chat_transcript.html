    const container = document.getElementById('chatContainer');
    const searchInput = document.getElementById('searchInput');

    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    function renderMessages(filterText = '') {
      container.innerHTML = '';
      const filter = filterText.toLowerCase();

      let visibleCount = 0;
      messages.forEach((msg, idx) => {
        if (filter && !msg.text.toLowerCase().includes(filter)) {
          return;
        }
        visibleCount++;

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.role}`;
        msgDiv.id = `msg-${idx}`;

        const roleName = msg.role === 'user' ? '👤 User' : '🤖 Antigravity AI Assistant';
        const timeFormatted = msg.time ? new Date(msg.time).toLocaleString() : '';

        const headerDiv = document.createElement('div');
        headerDiv.className = 'msg-header';
        headerDiv.innerHTML = `
          <span class="role-tag">${roleName}</span>
          <span>Step ${msg.step} &bull; ${timeFormatted}</span>
        `;

        const bodyDiv = document.createElement('div');
        bodyDiv.className = 'msg-body';
        try {
          bodyDiv.innerHTML = marked.parse(msg.text);
        } catch (e) {
          bodyDiv.textContent = msg.text;
        }

        msgDiv.appendChild(headerDiv);
        msgDiv.appendChild(bodyDiv);
        container.appendChild(msgDiv);
      });

      if (visibleCount === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">No messages match your search.</div>';
      }
    }

    renderMessages();

    searchInput.addEventListener('input', (e) => {
      renderMessages(e.target.value);
    });
  </script>
